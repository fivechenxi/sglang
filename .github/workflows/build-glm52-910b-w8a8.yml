name: Build GLM-5.2 910B W8A8 image

on:
  push:
    branches:
      - 910b-glm5.2-w8a8
    paths:
      - ".github/workflows/build-glm52-910b-w8a8.yml"
      - "docker/npu.Dockerfile"
      - "docker/glm52-910b-w8a8.Dockerfile"
      - "python/**"
      - "scripts/ascend/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: glm52-910b-w8a8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tag
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sglang:glm52-910b-w8a8-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push exact W8A8 baseline
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/glm52-910b-w8a8.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            SGLANG_REPOSITORY=https://github.com/${{ github.repository }}.git
            SGLANG_COMMIT=${{ github.sha }}
            BUILD_WORKFLOW_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "### GLM-5.2 910B W8A8 image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.image.outputs.tag }}\`"
            echo "- Base digest: \`sha256:175e295542c46204cdfcf0d8506d0c45a6c4ad90d7381924dab1f36ef25642de\`"
            echo "- Dependencies: preserved from the verified production image"
          } >> "$GITHUB_STEP_SUMMARY"
