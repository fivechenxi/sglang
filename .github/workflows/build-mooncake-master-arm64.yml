name: Build Mooncake master ARM64 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}
      - name: Build and push immutable master image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/mooncake-master-arm64.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/mooncake-master:0.3.13.post1-npu-arm64-${{ github.sha }}
