name: Build GLM-5.2 PD Router image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: glm52-pd-router-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_BOOTSTRAP_TOKEN }}

      - name: Compute immutable image tag
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sgl-model-gateway:glm52-pd-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push Router
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "### GLM-5.2 PD Router image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.image.outputs.tag }}\`"
            echo "- Platform: \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
